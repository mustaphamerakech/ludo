<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d2e">
<title>Ludo Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<!-- Online games go through public MQTT servers (secure websockets): works on mobile data and Wi-Fi. -->
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<!-- Accounts, profiles, friends and ranking: Firebase (free Spark plan). -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="grad-defs"></defs></svg>

<!-- ===== Home ===== -->
<div id="menu" class="screen active">
  <div class="home">
    <div class="logo">
      <div class="pawns" id="logo-pawns"></div>
      <h1>LUDO <span>MINI</span></h1>
    </div>
    <div class="card profile">
      <button class="p-av" id="p-av" aria-label="Change picture">😎</button>
      <div class="p-info">
        <button class="p-name" id="p-name">Player</button>
        <div class="lvl-row"><span class="lvl" id="p-lvl">Lv.1</span><div class="bar"><i id="p-bar"></i></div><span class="xp" id="p-xp">0/100</span></div>
      </div>
      <div class="coins" id="p-coins"><b class="coin"></b><span>0</span></div>
    </div>
    <button id="btn-gift" class="gift" style="display:none">🎁 Daily gift: +50 coins</button>
    <button id="btn-account" class="acct"></button>
    <div class="card">
      <button id="btn-create" class="btn" style="margin-top:0">🎲 Create a room</button>
      <div class="row" style="margin-top:12px">
        <input id="join-code" class="field code-field" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
        <button id="btn-join" class="btn alt">Join</button>
      </div>
      <div id="menu-err" class="err"></div>
      <button id="btn-bot" class="btn ghost">🤖 Play vs computer</button>
      <button id="btn-resume" class="btn green" style="display:none"></button>
    </div>
    <div class="tiles">
      <button class="tile" id="btn-friends"><span>👥</span>Friends<i class="dot"></i></button>
      <button class="tile" id="btn-top"><span>🏆</span>Ranking</button>
      <button class="tile" id="btn-shop"><span>🛍️</span>Shop</button>
      <button class="tile" id="btn-rules"><span>📖</span>Rules</button>
    </div>
  </div>
</div>

<!-- ===== Waiting room ===== -->
<div id="wait" class="screen">
  <div class="card center">
    <div id="wait-host">
      <h3>Room code</h3>
      <div id="wait-code" class="big-code">····</div>
      <p style="margin:0 0 6px; opacity:.85">Send this code (or the link) to your friend.</p>
      <button id="btn-share" class="btn alt">Share invite link</button>
    </div>
    <div id="wait-guest" style="display:none">
      <h3>Joining room</h3>
      <div id="wait-gcode" class="big-code">····</div>
    </div>
    <div class="spinner"></div>
    <p id="wait-msg" style="margin:4px 0 10px; font-weight:600">Waiting for your friend…</p>
    <div id="wait-net" class="net"><i></i><span>Connecting to the game server…</span></div>
    <button id="btn-cancel" class="btn ghost">Cancel</button>
  </div>
</div>

<!-- ===== Game ===== -->
<div id="game" class="screen">
  <div class="topbar">
    <button id="btn-leave" class="icon-btn" aria-label="Leave">‹</button>
    <div id="room-chip" class="chip"></div>
    <div class="spacer"></div>
    <div id="net-chip" class="chip net"><i></i><span></span></div>
    <button id="btn-sound" class="icon-btn" aria-label="Sound">🔊</button>
  </div>
  <div class="stage">
    <div id="banner"></div>
    <div class="seat top" id="seat-1">
      <div class="bubble"></div>
      <div style="text-align:right"><div class="pname"></div><div class="pstate"></div></div>
      <div class="dicebox"><div class="dice"></div><span class="x2">×2</span></div>
      <div class="avatar"><span class="em"></span><div class="pie"></div><span class="lv"></span></div>
    </div>
    <div id="board-wrap"><div id="board"></div></div>
    <div class="seat bottom" id="seat-0">
      <div class="bubble"></div>
      <div class="avatar"><span class="em"></span><div class="pie"></div><span class="lv"></span></div>
      <div class="dicebox"><div class="dice"></div><span class="x2">×2</span></div>
      <div><div class="pname"></div><div class="pstate"></div></div>
      <div class="spacer"></div>
      <div class="social">
        <button id="btn-emoji" class="sbtn" aria-label="Emoji">😀</button>
        <button id="btn-chat" class="sbtn" aria-label="Chat">💬<i class="dot"></i></button>
      </div>
    </div>
    <div id="hint"></div>
  </div>
  <div class="bottombar">
    <div class="items">
      <button class="item" id="it-x2"><div class="orb" data-icon="x2"></div><span class="n">0</span><span class="lbl">Double</span></button>
      <button class="item" id="it-pick"><div class="orb" data-icon="pick"></div><span class="n">0</span><span class="lbl">Choose</span></button>
      <button class="item" id="it-shield"><div class="orb" data-icon="shield"></div><span class="n">0</span><span class="lbl">Shield</span></button>
    </div>
  </div>
</div>

<div id="sheet"><div class="card" id="sheet-card"></div></div>
<div id="invite"></div>
<div id="toast"></div>

<script src="account.js?v=4"></script>
<script src="game.js?v=4"></script>
</body>
</html>
